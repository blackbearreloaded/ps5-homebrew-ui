# ps5-homebrew-ui - Lint, test, build, and publish a release for each new version.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, and package
    runs-on: ubuntu-24.04
    # The attest step signs with this run's identity and stores the attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 lld-18 make ninja-build ccache pkg-config tar unzip wget

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
            .deps/ps5-opengl
          key: deps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-python313-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/fetch-opengl-sdk.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        id: version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"
          # Only a version tag publishes a release; a run started by hand just builds.
          release=false
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            release=true
          fi
          echo "version=$content_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release this build: $release ($content_version)"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (docs/PULL_REQUEST_BUILDS.md); the version
      # in param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=ps5-homebrew-ui-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Clang static analysis stays a local check (make lint, make tidy).
      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run host GoogleTest suite
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      # The ZIP is the one release format: in-app updates and ProsperoStore install from
      # it. No compressed image is built or published here.
      - name: Build the release folder and ZIP
        run: make app

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # The console only starts an app whose files are open to all (CE-107750-0 otherwise).
      - name: Check every ZIP entry is stored as 0777
        run: |
          python3 - "dist/$TITLE_ID.zip" "$TITLE_ID" <<'PY'
          import sys, zipfile
          archive, title = sys.argv[1:3]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged entry"
              names = z.namelist()
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              assert title + "/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              print(f"{archive}: {len(names)} entries, all 0777")
          PY

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.zip" > SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "ps5-homebrew-ui-$GITHUB_SHA"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          shopt -s nullglob
          folder_zips=(PPSA*.zip)
          # The artifact holds exactly these two files at its root.
          if (( ${#files[@]} != 2 || ${#folder_zips[@]} != 1 )) || [[ ! -f SHA256SUMS ]]; then
            echo "Expected exactly one app-folder ZIP and SHA256SUMS at the artifact root." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          echo "folder_zip=${folder_zips[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          FOLDER_ZIP: ${{ steps.package.outputs.folder_zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("release/$FOLDER_ZIP" "release/$CHECKSUM")
          folder_zip_name="${FOLDER_ZIP##*/}"
          checksum_name="${CHECKSUM##*/}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r old_asset; do
              if [[ $old_asset != "$folder_zip_name" && $old_asset != "$checksum_name" ]]; then
                gh release delete-asset "$VERSION" "$old_asset" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done < <(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$VERSION" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Creates the version tag at the commit that was just built and tested.
            gh release create "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "ps5-homebrew-ui $VERSION"
          fi
