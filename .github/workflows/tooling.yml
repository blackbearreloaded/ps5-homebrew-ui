# ps5-homebrew-ui - Lint, test, build, and publish a release for each new version.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  push:
    branches:
      - main
    tags:
      - "[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build, and package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 clang-tidy-18 lld-18 make ninja-build ccache pkg-config tar unzip wget

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
            .deps/MkPFS
            .deps/ps5-opengl
          key: deps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-python313-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/fetch-opengl-sdk.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        id: version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$content_version" ]]; then
            echo "Release tag must exactly match param.json contentVersion: $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"
          # Only a version tag publishes a release; pushes to main just build.
          release=false
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            release=true
          fi
          echo "version=$content_version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release this build: $release ($content_version)"

      - name: Lint source and metadata
        run: make lint

      - name: Run host GoogleTest suite
        run: make test-unit

      - name: Run host integration tests
        run: make test-integration

      - name: Reproduce clean-room runtime shim
        run: make libc

      - name: Verify generated runtime is unchanged
        run: cd runtime && sha256sum -c libc.prx.sha256

      - name: Build compressed release image
        run: make ffpfsc

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Write release checksums
        run: cd dist && sha256sum "$TITLE_ID.ffpfsc" "$TITLE_ID.zip" > SHA256SUMS

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ps5-homebrew-ui-${{ github.sha }}
          path: |
            dist/${{ env.TITLE_ID }}.ffpfsc
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "ps5-homebrew-ui-$GITHUB_SHA"
          --dir release

      - name: Prepare release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -d '' files < <(find . -type f -print0)
          shopt -s nullglob
          images=(PPSA*.ffpfsc)
          folder_zips=(PPSA*.zip)
          # The artifact holds exactly these three files at its root.
          if (( ${#files[@]} != 3 || ${#images[@]} != 1 || ${#folder_zips[@]} != 1 )) || [[ ! -f SHA256SUMS ]]; then
            echo "Expected exactly one FFPFSC image, one app-folder ZIP, and SHA256SUMS at the artifact root." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS
          echo "image=${images[0]}" >> "$GITHUB_OUTPUT"
          echo "folder_zip=${folder_zips[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ steps.package.outputs.image }}
          FOLDER_ZIP: ${{ steps.package.outputs.folder_zip }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("release/$IMAGE" "release/$FOLDER_ZIP" "release/$CHECKSUM")
          image_name="${IMAGE##*/}"
          folder_zip_name="${FOLDER_ZIP##*/}"
          checksum_name="${CHECKSUM##*/}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r old_asset; do
              if [[ $old_asset != "$image_name" && $old_asset != "$folder_zip_name" && $old_asset != "$checksum_name" ]]; then
                gh release delete-asset "$VERSION" "$old_asset" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done < <(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$VERSION" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Creates the version tag at the commit that was just built and tested.
            gh release create "$VERSION" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "ps5-homebrew-ui $VERSION"
          fi
